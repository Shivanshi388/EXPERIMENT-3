<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>To-Do List</title>
<style>
* { box-sizing: border-box; }
body {
margin: 0; min-height: 100vh; padding: 40px 16px;
display: flex; justify-content: center;
font-family: "Segoe UI", Tahoma, Arial, sans-serif;
font-size: 15px; line-height: 1.5;
color: #1f2933; background: #e6f4f1;
}
.todo-box {
width: 100%; max-width: 520px; height: fit-content;
background: #fff; border: 1px solid #b7ddd5; border-radius: 10px;
padding: 24px;
}
h1 { margin: 0 0 18px; font-size: 26px; color: #0f766e; }

/* Add task form */
form { display: flex; gap: 8px; }
input[type="text"] {
flex: 1; min-width: 0; padding: 10px 12px;
font: inherit; border: 1px solid #9fcfc5; border-radius: 6px;
}
input[type="text"]:focus { outline: 2px solid #0f766e; border-color: #0f766e; }
button { font: inherit; cursor: pointer; border: none; border-radius: 6px; }
.add-btn { padding: 10px 18px; font-weight: bold; color: #fff; background: #0f766e; }
.add-btn:hover { background: #0b5a54; }
.error-text { min-height: 20px; margin: 6px 0 0; font-size: 13px; color: #c0392b; }

/* Filters */
.filter-bar { display: flex; gap: 6px; margin: 8px 0 12px; }
.filter-bar button {
padding: 5px 12px; font-size: 13px;
background: #fff; color: #0f766e; border: 1px solid #b7ddd5;
}
.filter-bar button.active { background: #0f766e; color: #fff; border-color: #0f766e; }

/* Task list */
ul { list-style: none; margin: 0; padding: 0; }
li {
display: flex; align-items: center; gap: 10px;
padding: 10px 8px; border-top: 1px solid #dcefea;
}
li:nth-child(odd) { background: #f5fbfa; }
li input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; accent-color: #0f766e; }
li span { flex: 1; word-break: break-word; }
li.completed span { text-decoration: line-through; color: #8a97a5; }
.remove-btn {
padding: 4px 10px; font-size: 13px; color: #c0392b;
background: transparent; border: 1px solid #e6b8b2;
}
.remove-btn:hover { background: #c0392b; color: #fff; }
.empty-msg { padding: 18px 8px; text-align: center; color: #777; border-top: 1px solid #dcefea; }
.bottom-bar {
display: flex; justify-content: space-between; align-items: center;
margin-top: 14px; font-size: 13px; color: #555;
}
.clear-btn {
padding: 4px 10px; font-size: 13px;
background: transparent; color: #0f766e; border: 1px solid #b7ddd5;
}
.clear-btn:hover { background: #e6f4f1; }
</style>
</head>
<body>

<main class="todo-box">
<h1>To-Do List</h1>

<form id="task-form">
<input type="text" id="task-input" placeholder="What needs to be done?"
aria-label="New task" autocomplete="off">
<button type="submit" class="add-btn">Add</button>
</form>
<p class="error-text" id="error-text" role="alert"></p>

<div class="filter-bar" id="filter-bar">
<button type="button" data-filter="all" class="active">All</button>
<button type="button" data-filter="active">Active</button>
<button type="button" data-filter="completed">Completed</button>
</div>

<ul id="task-list"></ul>

<div class="bottom-bar">
<span id="task-count"></span>
<button type="button" class="clear-btn" id="clear-btn">Clear completed</button>
</div>
</main>

<script>
// ----- Get elements from the DOM -----
const taskForm = document.getElementById('task-form');
const taskInput = document.getElementById('task-input');
const errorText = document.getElementById('error-text');
const taskList = document.getElementById('task-list');
const taskCount = document.getElementById('task-count');
const filterBar = document.getElementById('filter-bar');
const clearBtn = document.getElementById('clear-btn');

// ----- App data -----
let tasks = loadTasks();      // each task: { id, text, done }
let activeFilter = 'all';

// ----- Save and load tasks (localStorage) -----
function loadTasks() {
try {
return JSON.parse(localStorage.getItem('my-tasks')) || [];
} catch (err) {
return [];
}
}

function saveTasks() {
try {
localStorage.setItem('my-tasks', JSON.stringify(tasks));
} catch (err) { /* storage not available */ }
}

// ----- Add a task -----
taskForm.addEventListener('submit', function (event) {
event.preventDefault();
const text = taskInput.value.trim();
if (text === '') {
errorText.textContent = 'Please enter a task first.';
return;
}
errorText.textContent = '';
tasks.push({ id: Date.now(), text: text, done: false });
taskInput.value = '';
taskInput.focus();
refresh();
});

// ----- Mark a task as completed -----
function toggleTask(id) {
tasks = tasks.map(function (task) {
if (task.id === id) {
return { id: task.id, text: task.text, done: !task.done };
}
return task;
});
refresh();
}

// ----- Delete a task -----
function removeTask(id) {
tasks = tasks.filter(function (task) { return task.id !== id; });
refresh();
}

// ----- Filter buttons and clear completed -----
filterBar.addEventListener('click', function (event) {
const chosen = event.target.dataset.filter;
if (!chosen) return;
activeFilter = chosen;
filterBar.querySelectorAll('button').forEach(function (btn) {
btn.classList.toggle('active', btn.dataset.filter === chosen);
});
showTasks();
});

clearBtn.addEventListener('click', function () {
tasks = tasks.filter(function (task) { return !task.done; });
refresh();
});

// ----- Draw the list on the page -----
function showTasks() {
taskList.innerHTML = '';

const visibleTasks = tasks.filter(function (task) {
if (activeFilter === 'active') return !task.done;
if (activeFilter === 'completed') return task.done;
return true;
});

if (visibleTasks.length === 0) {
const emptyItem = document.createElement('li');
emptyItem.className = 'empty-msg';
emptyItem.textContent = tasks.length === 0
? 'No tasks yet. Add your first task above.'
: 'No tasks in this view.';
taskList.appendChild(emptyItem);
}

visibleTasks.forEach(function (task) {
const item = document.createElement('li');
if (task.done) item.classList.add('completed');

const checkbox = document.createElement('input');
checkbox.type = 'checkbox';
checkbox.checked = task.done;
checkbox.setAttribute('aria-label', 'Mark "' + task.text + '" as completed');
checkbox.addEventListener('change', function () { toggleTask(task.id); });

const label = document.createElement('span');
label.textContent = task.text;   // textContent keeps user text safe

const removeBtn = document.createElement('button');
removeBtn.type = 'button';
removeBtn.className = 'remove-btn';
removeBtn.textContent = 'Delete';
removeBtn.addEventListener('click', function () { removeTask(task.id); });

item.appendChild(checkbox);
item.appendChild(label);
item.appendChild(removeBtn);
taskList.appendChild(item);
});

const pending = tasks.filter(function (task) { return !task.done; }).length;
taskCount.textContent = pending + (pending === 1 ? ' task left' : ' tasks left');
}

function refresh() {
saveTasks();
showTasks();
}

showTasks();
</script>
</body>
</html>
